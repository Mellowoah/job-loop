<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#142e35"><title>Job Loop</title><style>:root{--ink:#142e35;--muted:#50636a;--line:#cfdbdd;--paper:#fff;--bg:#eef2f1;--accent:#006658;--gold:#8b4a00}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:16px/1.5 system-ui,sans-serif;color:var(--ink)}header{background:var(--ink);color:white}.top{max-width:1160px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:24px;padding:24px}.brand{font-size:29px;font-weight:800;letter-spacing:-1px;color:white;text-decoration:none}.brand span{display:block;font-size:10px;letter-spacing:2px;color:#b9d4cf}.mode{display:flex;align-items:center;gap:10px}.mode select{width:auto;max-width:190px}main{max-width:1160px;margin:auto;padding:20px 24px 64px}.notice{font-size:12px;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:16px}nav{display:flex;gap:8px;margin:20px 0 28px}button,.button{min-height:46px;border:1px solid #acbdc1;background:white;color:var(--ink);border-radius:7px;padding:10px 16px;font:inherit;font-weight:650;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}button:hover{border-color:var(--accent);background:#f0f8f5}button.primary,button.selected{background:var(--accent);border-color:var(--accent);color:white}button.small{font-size:13px;padding:8px 12px;min-height:44px}.heading{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:22px 0}h1{font-size:30px;line-height:1.2;letter-spacing:-.8px;margin:0 0 8px}h2{font-size:21px;line-height:1.3;margin:0 0 16px}h3{font-size:16px;margin:0 0 8px}p{margin:8px 0 16px}.muted,small{color:var(--muted)}.eyebrow{font-size:12px;font-weight:750;text-transform:uppercase;letter-spacing:1.3px;color:var(--accent);margin-bottom:8px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.detail{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px;align-items:start}.card{background:white;border:1px solid var(--line);border-radius:12px;padding:24px;margin-bottom:20px;box-shadow:0 2px 3px #142e3505;overflow-wrap:anywhere}.grid .card{margin:0}.job-card{border-top:4px solid var(--accent)}.pill{display:inline-block;border-radius:5px;background:#e8f3ef;color:#075448;font-size:12px;font-weight:750;padding:5px 9px;text-transform:uppercase;letter-spacing:.4px}.pill.amber{background:#fff1d9;color:#784200}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.wrap{flex-wrap:wrap}.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}.stats{display:flex;gap:22px;margin:18px 0}.stats strong{display:block;font-size:23px}.stats span{font-size:12px;color:var(--muted)}progress{width:100%;height:9px;accent-color:var(--accent)}.task{display:flex;gap:12px;align-items:center;border-bottom:1px solid #e5ecec;padding:10px 0}.task label{flex:1;display:flex;gap:12px;align-items:center;cursor:pointer;margin:0;font-weight:500}.task input,.expectation input{width:24px;height:24px;accent-color:var(--accent);flex-shrink:0}.done{text-decoration:line-through;color:var(--muted)}.expectation{display:flex;align-items:center;gap:10px;padding:8px 0}.expectation input:disabled{opacity:.9}.callout{padding:15px;border-left:4px solid var(--gold);background:#fff5e5;margin:16px 0;border-radius:3px}.plan{border-top:4px solid var(--accent)}.plan ol,.plan ul{padding-left:22px}.plan li{margin:9px 0}.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px;margin-top:16px}.photos figure{margin:0}.photos img{width:100%;height:120px;object-fit:cover;border-radius:7px;border:1px solid var(--line);cursor:zoom-in}.photos figcaption{font-size:12px;color:var(--muted)}.empty{padding:24px;border:1px dashed #8ba4a8;border-radius:8px;color:var(--muted);margin-top:14px}.finding{border-top:1px solid var(--line);padding-top:20px;margin-top:20px}.preline{white-space:pre-wrap}label{display:block;font-weight:650;margin:16px 0 6px}input,textarea,select{display:block;width:100%;padding:12px;font:inherit;border:1px solid #9aafb3;border-radius:6px;background:white;color:var(--ink);min-height:46px}textarea{min-height:95px;resize:vertical}input[type=checkbox]{display:inline-block;min-height:24px;padding:0}input[type=file]{font-size:14px}dialog{border:0;border-radius:14px;width:min(660px,calc(100% - 24px));max-height:92vh;padding:26px;color:var(--ink)}dialog::backdrop{background:#09242bcc}.dialog-head{display:flex;justify-content:space-between;align-items:start;gap:16px}#form-error,#warning{color:#9b2119}#warning:not(:empty){padding:15px;background:#ffe8e4;margin-top:12px}#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:white;padding:12px 20px;border-radius:8px;display:none;z-index:10;max-width:92vw}.timeline{border-left:3px solid #adc8c0;padding-left:18px;margin-top:20px}.timeline details{margin-bottom:18px}summary{cursor:pointer;min-height:44px;font-weight:700}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #dd8d00;outline-offset:3px}.divider{border-top:1px solid var(--line);margin:20px 0}@media(max-width:720px){.top{padding:20px;align-items:flex-start;flex-direction:column;gap:18px}.mode{width:100%;flex-wrap:wrap}.mode select{max-width:190px}main{padding:16px 16px 48px}.grid,.detail{grid-template-columns:1fr}.card{padding:20px}.heading{align-items:flex-start;flex-wrap:wrap}h1{font-size:26px}nav{gap:6px}nav button{padding:10px 12px;font-size:14px}.detail aside{grid-row:auto}.task{gap:8px}.task button{padding:8px}.photos{grid-template-columns:repeat(2,minmax(0,1fr))}dialog{padding:20px}.heading .actions{margin-top:0}}
</style></head>
<body><header><div class="top"><a class="brand" href="#">Job Loop <span>FIELD WORK · CLOSED LOOPS</span></a><div class="mode"><label for="mode">View as</label><select id="mode"><option>Boss</option><option>Employee</option></select><select id="identity" aria-label="Choose employee"></select></div></div></header><main><div class="notice">LOCAL PROTOTYPE · No login or shared sync. Boss / Employee views are not access controls. Export a backup regularly.</div><div id="warning" role="alert"></div><nav><button data-nav="jobs" class="selected">Jobs</button><button data-nav="employees">Employees</button><button data-nav="backup">Backup & help</button></nav><section id="app"></section></main><dialog id="modal"><form id="editor"><div class="dialog-head"><h2 id="dialog-title"></h2><button type="button" id="cancel" aria-label="Close">✕</button></div><div id="fields"></div><p id="form-error" role="alert"></p><div class="actions"><button type="button" id="cancel-bottom">Cancel</button><button type="submit" class="primary" id="save">Save</button></div></form></dialog><div id="toast" role="status"></div><script>'use strict';
const KEY='job-loop-v1';
const templates={Interior:['Review job description and boss needs','Before photos (multiple angles; panorama if needed)','Record existing damage in Findings','Protect floors and furniture','Patch and prep walls','Prime','Cut in edges','Roll walls','Paint doors and trim','Cleanup','Final walkthrough vs boss needs'],General:['Review scope and boss needs','Before photos (multiple angles; panorama if needed)','Record existing damage in Findings','Prepare and protect work area','Complete assigned work','Cleanup','Final walkthrough vs boss needs']};
const statuses=['prep','in progress','waiting on client','done'], findingStates=['recorded','quoted','approved','declined','completed'];
const $=s=>document.querySelector(s), e=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>globalThis.crypto?.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36).slice(2);
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const stamp=()=>new Date().toISOString(), time=v=>new Date(v).toLocaleString('en-US',{timeZone:'America/New_York',dateStyle:'medium',timeStyle:'short'})+' ET';
function seed(){return {version:1,employees:[{id:'emp-1',name:'Jordan Rivera',role:'Lead painter',notes:'Interior prep, finish coats and walkthroughs.',active:true},{id:'emp-2',name:'Casey Brooks',role:'General trades',notes:'Protection, patching and small repairs.',active:true}],jobs:[{id:'job-1',title:'Interior refresh · living room & hallway',address:'DEMO · 214 Maple Avenue',type:'Interior',employeeId:'emp-1',description:'Prep and repaint living room and hallway walls, doors and trim. Tile repair is not included in the painting scope.',bossNeeds:'Even wall coverage; no flashing or roller marks\nClean cut lines and smooth white trim\nProtect floors and furniture; no paint on tile\nLeave rooms clean and complete a final walkthrough',expectations:[false,false,false,false],startDate:today(),status:'in progress',tasks:templates.Interior.map((text,i)=>({id:'task-'+i,text,done:[0,2,3].includes(i)})),beforePhotos:[],findings:[{id:'finding-1',what:'Cracked tile noticed before painting',where:'Hallway by bathroom threshold',suggested:'Offer a separate quote to replace the broken tile and inspect adjacent grout.',recordedBy:'Jordan Rivera',timestamp:stamp(),status:'recorded',photos:[]}],closeouts:[]}]};}
let data,mode='Boss',employeeId='emp-1',tab='jobs',jobId=null,busy=false;
try{const saved=localStorage.getItem(KEY);data=saved?validate(JSON.parse(saved)):seed();localStorage.setItem(KEY,JSON.stringify(data));}catch(err){data=seed();$('#warning').textContent='Browser storage is unavailable or the saved file is invalid. Export before closing this page. Existing storage has not been overwritten.';}
function toast(text){$('#toast').textContent=text;$('#toast').style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('#toast').style.display='none',4000)}
function commit(fn){const old=JSON.stringify(data);try{fn();localStorage.setItem(KEY,JSON.stringify(data));$('#warning').textContent='';return true}catch(err){data=JSON.parse(old);$('#warning').textContent='Could not save. Browser storage may be full or disabled. Your last saved data is intact. Export a backup; use fewer/smaller photos or a browser that allows storage.';if($('#modal').open)$('#modal').close();render();toast('Not saved — check the storage warning.');return false}}
function allowed(j){return mode==='Boss'||j.employeeId===employeeId}function current(){return data.jobs.find(j=>j.id===jobId&&allowed(j))}function actor(){return mode==='Boss'?'Boss':data.employees.find(x=>x.id===employeeId)?.name||'Employee'}
function options(arr,value){return arr.map(v=>`<option ${v===value?'selected':''}>${e(v)}</option>`).join('')}
function peopleOptions(value){return data.employees.map(p=>`<option value="${e(p.id)}" ${p.id===value?'selected':''}>${e(p.name)}${p.active?'':' (inactive)'}</option>`).join('')}
function field(label,name,value='',type='text',required=true){return `<label for="f-${name}">${label}</label><input id="f-${name}" name="${name}" type="${type}" value="${e(value)}" ${required?'required':''} maxlength="500">`}
function area(label,name,value='',required=false){return `<label for="f-${name}">${label}</label><textarea id="f-${name}" name="${name}" ${required?'required':''} maxlength="6000">${e(value)}</textarea>`}
function select(label,name,opts){return `<label for="f-${name}">${label}</label><select id="f-${name}" name="${name}">${opts}</select>`}
function photos(list){return list.length?`<div class="photos">${list.map(p=>`<figure><a href="${e(p.data)}" target="_blank" rel="noopener" aria-label="Open photo ${e(p.label)}"><img src="${e(p.data)}" alt="${e(p.label)}" loading="lazy"></a><figcaption>${e(p.label)}${p.timestamp?'<br>'+e(time(p.timestamp)):''}</figcaption></figure>`).join('')}</div>`:''}
function render(){ $('#identity').innerHTML=peopleOptions(employeeId);$('#identity').hidden=mode!=='Employee';$('#mode').value=mode;document.querySelectorAll('[data-nav]').forEach(b=>{b.classList.toggle('selected',b.dataset.nav===tab);b.hidden=b.dataset.nav==='employees'&&mode!=='Boss'});if(tab==='employees'&&mode!=='Boss')tab='jobs';if(tab==='employees')renderEmployees();else if(tab==='backup')renderBackup();else if(current())renderJob(current());else renderJobs();}
function renderJobs(){const jobs=data.jobs.filter(allowed);$('#app').innerHTML=`<div class="heading"><div class="intro"><div class="eyebrow">${mode==='Boss'?'Crew overview':'My assignments'}</div><h1>Work with a clear next step.</h1><p class="muted">Scope, evidence and follow-through — in one place.</p></div>${mode==='Boss'?'<button class="primary" data-action="new-job">+ Assign job</button>':''}</div><div class="grid">${jobs.map(j=>{const n=j.tasks.filter(t=>t.done).length;return `<article class="card job-card"><div class="row wrap"><span class="eyebrow">${e(j.type)}</span><span class="pill">${e(j.status)}</span></div><h2>${e(j.title)}</h2><p class="muted">${e(j.address)}<br>${e(data.employees.find(p=>p.id===j.employeeId)?.name||'Unassigned')} · Starts ${e(j.startDate)}</p><div class="stats"><div><strong>${n}/${j.tasks.length}</strong><span>tasks complete</span></div><div><strong>${j.findings.filter(f=>!['declined','completed'].includes(f.status)).length}</strong><span>open findings</span></div><div><strong>${j.closeouts.length}</strong><span>daily closeouts</span></div></div><progress value="${n}" max="${j.tasks.length||1}"></progress><div class="actions"><button data-open="${e(j.id)}" class="primary">Open job →</button></div></article>`}).join('')||'<div class="empty">No assigned jobs. Ask the boss to create or assign a job.</div>'}</div>`;}
function renderEmployees(){$('#app').innerHTML=`<div class="heading"><div><div class="eyebrow">People</div><h1>Employee profiles</h1></div><button class="primary" data-action="new-employee">+ Add employee</button></div><div class="grid">${data.employees.map(p=>`<article class="card"><div class="row"><h2>${e(p.name)}</h2><span class="pill ${p.active?'':'amber'}">${p.active?'Active':'Inactive'}</span></div><h3>${e(p.role)}</h3><p class="muted preline">${e(p.notes)}</p><p>${data.jobs.filter(j=>j.employeeId===p.id).length} assigned job(s)</p><button data-edit-employee="${e(p.id)}">Edit profile</button></article>`).join('')}</div>`}
function plan(j){const done=j.tasks.filter(t=>t.done),left=j.tasks.filter(t=>!t.done),needs=j.bossNeeds.split('\n').filter(x=>x.trim()),pending=j.findings.filter(f=>['recorded','quoted'].includes(f.status)),approved=j.findings.filter(f=>f.status==='approved');return `<div class="card plan"><div class="eyebrow">Checklist-based guidance · not AI verification</div><h2>Next shift plan</h2>${!j.beforePhotos.length?'<div class="callout"><strong>Prep first:</strong> Finish before photos before starting production work. Capture multiple angles; use a panoramic when needed.</div>':''}<h3>Completed so far</h3><p>${done.length?e(done.map(t=>t.text).join(' · ')):'No checklist items completed yet.'}</p><h3>Next work, in checklist order</h3>${left.length?`<ol>${left.map(t=>`<li>${e(t.text)}</li>`).join('')}</ol>`:'<p>Checklist complete. Confirm evidence and expectations before marking the job done.</p>'}<h3>Still needed to meet boss expectations</h3><ul>${needs.filter((_,i)=>!j.expectations[i]).map(n=>`<li>${e(n)} — not yet verified</li>`).join('')||'<li>All expectations manually verified.</li>'}</ul><p class="muted">Photos support a review; the app does not judge paint quality. Boss verification is separate from task checkmarks.</p><h3>Client decisions to follow up</h3>${pending.length?`<ul>${pending.map(f=>`<li><strong>${e(f.what)}</strong> · ${e(f.where)}<br>${e(f.suggested||'Prepare a separate quote / clarify scope.')} (${e(f.status)})</li>`).join('')}</ul>`:'<p>No findings awaiting a client decision.</p>'}${approved.length?`<h3>Approved add-ons to schedule</h3><ul>${approved.map(f=>`<li>${e(f.what)} — ${e(f.suggested)}</li>`).join('')}</ul>`:''}<small>Suggestions use the saved checklist, expectation confirmations and finding statuses. Approval here is a local note, not a signed change order.</small></div>`}
function renderJob(j){const needs=j.bossNeeds.split('\n').filter(x=>x.trim());$('#app').innerHTML=`<button data-action="back">← All jobs</button><div class="heading"><div><div class="eyebrow">${e(j.type)} · ${e(data.employees.find(p=>p.id===j.employeeId)?.name)}</div><h1>${e(j.title)}</h1><p class="muted">${e(j.address)} · Starts ${e(j.startDate)}</p><span class="pill">${e(j.status)}</span></div>${mode==='Boss'?'<button data-action="edit-job">Edit assignment</button>':''}</div><div class="detail"><div><section class="card"><h2>Scope & boss needs</h2><p class="preline">${e(j.description)}</p><div class="divider"></div><p class="muted">${mode==='Boss'?'Verify each expectation after reviewing the work and evidence.':'Boss confirms these expectations after reviewing your work.'}</p>${needs.map((n,i)=>`<label class="expectation"><input type="checkbox" data-expect="${i}" ${j.expectations[i]?'checked':''} ${mode==='Boss'?'':'disabled'}><span>${e(n)}</span></label>`).join('')}</section><section class="card"><div class="row wrap"><h2>01 / Before photos</h2><button data-action="before-photo">+ Add photos</button></div><p>Take multiple angles. If a room or wall will not show in one shot, take a <strong>panoramic</strong> with your phone's camera and upload it.</p><small>Document existing condition before starting work. Add a clear location label.</small>${photos(j.beforePhotos)||'<div class="empty">No before photos yet.<br>Suggested angles: north wall · south wall · doors & trim · bathroom floor.</div>'}</section><section class="card"><div class="row wrap"><h2>02 / Daily checklist</h2><button data-action="add-task" class="small">+ Task</button></div><p class="muted">Checkmarks save immediately. Submit a daily closeout to preserve today's progress and evidence.</p>${j.tasks.map(t=>`<div class="task"><label><input type="checkbox" data-task="${e(t.id)}" ${t.done?'checked':''}><span class="${t.done?'done':''}">${e(t.text)}</span></label><button class="small" data-edit-task="${e(t.id)}" aria-label="Edit ${e(t.text)}">Edit</button></div>`).join('')}<div class="actions"><button class="primary" data-action="closeout">Submit end of day →</button></div></section><section class="card"><div class="row wrap"><h2>03 / Findings & follow-up</h2><button data-action="finding">+ Record finding</button></div><p><strong>Outside the scope? Record it.</strong> Log a sales follow-up and document that the condition was seen and reported. Do not do extra work without approval.</p><small>A dated record supports responsibility discussions; it does not itself notify a client, prove a condition was pre-existing, or eliminate liability.</small>${j.findings.map(f=>`<article class="finding"><div class="row wrap"><h3>${e(f.what)}</h3><span class="pill amber">${e(f.status)}</span></div><p><strong>Where:</strong> ${e(f.where)}</p><p><strong>Add-on opportunity:</strong> ${e(f.suggested||'Not specified')}</p><small>Recorded by ${e(f.recordedBy)} · ${e(time(f.timestamp))}</small>${photos(f.photos)}${mode==='Boss'?`<label>Status / client decision (manually recorded)<select data-finding-status="${e(f.id)}">${options(findingStates,f.status)}</select></label>`:''}</article>`).join('')||'<div class="empty">No findings recorded.</div>'}</section><section class="card"><h2>Daily closeouts</h2><p class="muted">Dated snapshots, including the plan at the time of submission.</p><div class="timeline">${[...j.closeouts].reverse().map(c=>`<details><summary>${e(c.date)} · ${e(c.by)} · ${c.completed.length}/${c.tasks.length} complete</summary><p class="muted">Saved ${e(time(c.timestamp))}</p><p><strong>Completed:</strong> ${e(c.completed.join(' · ')||'None')}</p><p><strong>Completed this closeout:</strong> ${e((c.newlyCompleted||[]).join(' · ')||'No new completions since the prior closeout')}</p><p class="preline"><strong>Notes / blockers:</strong> ${e(c.notes||'None recorded')}</p>${photos(c.photos)}<h3>Next-day work at submission</h3><ul>${c.next.map(x=>`<li>${e(x)}</li>`).join('')||'<li>Checklist complete; review evidence and expectations.</li>'}</ul><h3>Expectations still unverified</h3><ul>${c.unmet.map(x=>`<li>${e(x)}</li>`).join('')||'<li>All manually verified.</li>'}</ul><h3>Client decisions pending</h3><ul>${c.open.map(x=>`<li>${e(x)}</li>`).join('')||'<li>None.</li>'}</ul></details>`).join('')||'<p>No daily closeouts submitted yet.</p>'}</div></section></div><aside>${plan(j)}<div class="card"><h3>Keep the loop moving</h3><p class="muted">Record → quote → client decision → complete. The boss updates finding status after a real conversation or sign-off.</p><small>No automatic messages or notifications are sent in this prototype.</small></div></aside></div>`;}
function renderBackup(){let size=(new Blob([JSON.stringify(data)]).size/1048576).toFixed(2);$('#app').innerHTML=`<div class="heading"><div><div class="eyebrow">Your data</div><h1>Backup & help</h1></div></div><section class="card"><h2>Saved only in this browser</h2><p>Local data size: approximately <strong>${size} MB</strong>. Browser storage limits vary, often around 5 MB for localStorage. Photos are resized to 1280 pixels and compressed as JPEG. Export regularly, especially before changing browsers, clearing site data or using private browsing.</p><div class="row wrap"><button class="primary" data-action="export">Export JSON backup</button><button data-action="import">Import JSON backup</button></div><p class="muted">Import replaces this browser's entire Job Loop dataset after confirmation. Export first. JSON backups contain employee details, addresses and photos: keep them private.</p></section><section class="card"><h2>How the loop works</h2><ol><li>Boss creates profiles and assigns jobs with scope and one expectation per line.</li><li>Employee selects their identity, opens an assignment and captures labeled before photos.</li><li>Record out-of-scope issues in Findings, including add-on work and photos.</li><li>Check tasks off, add verification photos and submit end of day.</li><li>Review the next-shift plan. Boss verifies expectations and records client decisions.</li></ol><p>Boss and Employee views are a convenience, not authentication. Everyone with access to this browser can switch views. This is a single-device prototype with no multi-user sync, email/SMS, automated image review, legally binding signatures or server backup.</p><p>Photos can contain sensitive details. Camera access and direct file opening depend on your browser; use a local static server if file-based storage is restricted.</p></section>`}
function dialog(title,html,submit){$('#dialog-title').textContent=title;$('#fields').innerHTML=html;$('#form-error').textContent='';$('#save').disabled=false;$('#editor').onsubmit=async ev=>{ev.preventDefault();if(busy)return;busy=true;$('#save').disabled=true;try{const ok=await submit(new FormData($('#editor')));if(ok!==false){$('#modal').close();render();toast('Saved locally.')}}catch(err){$('#form-error').textContent=err.message||'Could not save.'}finally{busy=false;$('#save').disabled=false}};$('#modal').showModal()}
function employeeForm(id){const p=data.employees.find(x=>x.id===id);dialog(p?'Edit employee':'New employee',field('Name','name',p?.name)+field('Trade / role','role',p?.role)+area('Notes','notes',p?.notes)+select('Profile status','active',`<option value="yes" ${p?.active!==false?'selected':''}>Active</option><option value="no" ${p?.active===false?'selected':''}>Inactive</option>`),f=>{if(!f.get('name').trim()||!f.get('role').trim())throw Error('Name and role cannot be blank.');return commit(()=>{const values={name:f.get('name').trim(),role:f.get('role').trim(),notes:f.get('notes'),active:f.get('active')==='yes'};p?Object.assign(p,values):data.employees.push({id:uid(),...values})})})}
function jobForm(j){if(!data.employees.length){toast('Create an employee first.');return}dialog(j?'Edit assignment':'Assign a job',field('Job title','title',j?.title)+field('Site / address','address',j?.address)+select('Assigned employee','employeeId',peopleOptions(j?.employeeId))+select('Job type','type',options(Object.keys(templates),j?.type||'Interior'))+'<small>New jobs get a matching checklist. Changing type on an existing job preserves its edited checklist.</small>'+area('Description / included scope','description',j?.description,true)+area('Boss needs — one success criterion per line','bossNeeds',j?.bossNeeds,true)+field('Start date','startDate',j?.startDate||today(),'date')+select('Status','status',options(statuses,j?.status||'prep')),f=>{const v=Object.fromEntries(f);for(const key of ['title','address','description','bossNeeds'])if(!v[key].trim())throw Error('Complete the required fields.');return commit(()=>{const oldNeeds=j?.bossNeeds.split('\n').filter(x=>x.trim())||[];const expectations=v.bossNeeds.split('\n').filter(x=>x.trim()).map(n=>{const i=oldNeeds.indexOf(n);return i>=0?!!j.expectations[i]:false});if(j)Object.assign(j,v,{expectations});else{const id=uid();data.jobs.push({id,...v,expectations,tasks:templates[v.type].map(text=>({id:uid(),text,done:false})),beforePhotos:[],findings:[],closeouts:[]});jobId=id}})})}
const photoFields=(required=false)=>field('Photo label / location','photoLabel','','text',required)+`<label for="photo-files">Photos (JPEG, PNG or WebP; up to 6 at once)</label><input id="photo-files" name="photos" type="file" accept="image/jpeg,image/png,image/webp" capture="environment" multiple ${required?'required':''}><small>Use the phone camera or choose existing photos. For panoramas, use your camera's panorama mode first. HEIC is not supported: choose a JPEG export.</small><div id="photo-preview" class="photos"></div>`;
async function compress(file){if(file.size>25000000)throw Error('Choose a photo smaller than 25 MB.');if(!['image/jpeg','image/png','image/webp'].includes(file.type))throw Error('Use JPEG, PNG or WebP photos.');const url=URL.createObjectURL(file);try{const img=await new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=()=>rej(Error('This image could not be read. Try a JPEG export.'));im.src=url});const ratio=Math.min(1,1280/Math.max(img.width,img.height));const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.width*ratio));canvas.height=Math.max(1,Math.round(img.height*ratio));const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);return canvas.toDataURL('image/jpeg',.72)}finally{URL.revokeObjectURL(url)}}
async function readPhotos(f){const files=f.getAll('photos').filter(x=>x.size);if(files.length>6)throw Error('Add at most six photos at once.');const label=String(f.get('photoLabel')||'Verification photo').trim()||'Verification photo';const result=[];for(let i=0;i<files.length;i++)result.push({id:uid(),label:label+(files.length>1?` · ${i+1}`:''),data:await compress(files[i]),timestamp:stamp()});return result}
function photoForm(j){dialog('Add before photos','<p>Capture multiple angles before production. Use a panoramic if a room or wall will not fit in one shot.</p>'+photoFields(true),async f=>{const pics=await readPhotos(f);if(!pics.length)throw Error('Choose at least one photo.');return commit(()=>j.beforePhotos.push(...pics))})}
function findingForm(j){dialog('Record out-of-scope finding','<p>Document the condition and open a sales follow-up. Recording does not send a message or authorize extra work.</p>'+field('What was found?','what')+field('Where?','where')+area('Suggested add-on work / cross-sell','suggested')+photoFields(false),async f=>{if(!f.get('what').trim()||!f.get('where').trim())throw Error('Describe the finding and its location.');const pics=await readPhotos(f);return commit(()=>j.findings.push({id:uid(),what:f.get('what').trim(),where:f.get('where').trim(),suggested:f.get('suggested'),photos:pics,recordedBy:actor(),timestamp:stamp(),status:'recorded'}))})}
function closeoutForm(j){dialog('End-of-day closeout',`<p>Save a dated snapshot of the checklist, evidence and next-day plan.</p>${field('Work date','date',today(),'date')}<h3>Confirm completed tasks</h3>${j.tasks.map((t,i)=>`<label class="expectation"><input type="checkbox" name="done" value="${i}" ${t.done?'checked':''}><span>${e(t.text)}</span></label>`).join('')}${area('Today’s notes / blockers','notes')}${photoFields(false)}<p class="muted">Verification photos are recommended. Without photos, this record is self-reported, not visual verification.</p>`,async f=>{const pics=await readPhotos(f),completed=new Set(f.getAll('done').map(Number));return commit(()=>{const prior=j.closeouts.at(-1)?.completed||[];j.tasks.forEach((t,i)=>t.done=completed.has(i));const all=j.tasks.filter(t=>t.done).map(t=>t.text),next=j.tasks.filter(t=>!t.done).map(t=>t.text);if(!j.beforePhotos.length)next.unshift('PREP FIRST: Finish before photos (multiple angles; panorama if needed) before production work.');j.closeouts.push({id:uid(),date:f.get('date'),timestamp:stamp(),by:actor(),notes:f.get('notes'),photos:pics,tasks:j.tasks.map(t=>({...t})),completed:all,newlyCompleted:all.filter(t=>!prior.includes(t)),next,unmet:j.bossNeeds.split('\n').filter(x=>x.trim()).filter((_,i)=>!j.expectations[i]),open:j.findings.filter(x=>['recorded','quoted'].includes(x.status)).map(x=>`${x.what} · ${x.where} · ${x.status}: ${x.suggested||'Prepare a quote'}`)})})})}
function taskForm(j,id){const t=j.tasks.find(x=>x.id===id);dialog(t?'Edit checklist item':'Add checklist item',field('Task','text',t?.text),f=>{if(!f.get('text').trim())throw Error('Task cannot be blank.');return commit(()=>t?t.text=f.get('text').trim():j.tasks.push({id:uid(),text:f.get('text').trim(),done:false}))})}
function exportData(){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`job-loop-backup-${today()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Backup downloaded. Store it securely.');}
function validate(d){const bad=()=>{throw Error('Invalid Job Loop backup. No changes made.')},str=x=>typeof x==='string'&&x.length<=100000,arr=x=>Array.isArray(x)&&x.length<=10000,photo=p=>p&&str(p.label)&&typeof p.data==='string'&&/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(p.data)&&p.data.length<7000000&&(!p.timestamp||!isNaN(Date.parse(p.timestamp))),task=t=>t&&str(t.id)&&str(t.text)&&typeof t.done==='boolean',textarr=x=>arr(x)&&x.every(str);if(!d||d.version!==1||!arr(d.employees)||!arr(d.jobs))bad();for(const p of d.employees)if(!p||!['id','name','role','notes'].every(k=>str(p[k]))||typeof p.active!=='boolean')bad();if(new Set(d.employees.map(x=>x.id)).size!==d.employees.length)bad();for(const j of d.jobs){if(!j||!['id','title','address','description','bossNeeds','employeeId','startDate'].every(k=>str(j[k]))||!d.employees.some(x=>x.id===j.employeeId)||!Object.hasOwn(templates,j.type)||!statuses.includes(j.status)||!arr(j.expectations)||!j.expectations.every(x=>typeof x==='boolean')||!arr(j.tasks)||!j.tasks.every(task)||!arr(j.beforePhotos)||!j.beforePhotos.every(photo)||!arr(j.findings)||!arr(j.closeouts))bad();for(const f of j.findings)if(!f||!['id','what','where','suggested','recordedBy','timestamp'].every(k=>str(f[k]))||isNaN(Date.parse(f.timestamp))||!findingStates.includes(f.status)||!arr(f.photos)||!f.photos.every(photo))bad();for(const c of j.closeouts)if(!c||!['id','date','timestamp','by','notes'].every(k=>str(c[k]))||isNaN(Date.parse(c.timestamp))||!arr(c.photos)||!c.photos.every(photo)||!arr(c.tasks)||!c.tasks.every(task)||!['completed','next','unmet','open'].every(k=>textarr(c[k]))||(c.newlyCompleted&&!textarr(c.newlyCompleted)))bad()}if(new Set(d.jobs.map(x=>x.id)).size!==d.jobs.length)bad();return d}
function importData(){dialog('Import a backup','<div class="callout">This replaces all local employees, jobs, photos and closeouts. Export your current data first.</div><label for="backup-file">Job Loop JSON backup</label><input id="backup-file" name="backup" type="file" accept="application/json,.json" required><label class="expectation"><input type="checkbox" required><span>I understand this replaces all local data.</span></label>',async f=>{const file=f.get('backup');if(file.size>15000000)throw Error('Backup exceeds the 15 MB import limit.');let parsed;try{parsed=validate(JSON.parse(await file.text()))}catch(err){throw Error('Invalid or incompatible Job Loop backup. No changes made.')}return commit(()=>{data=parsed;employeeId=data.employees[0]?.id||'';jobId=null})})}
$('#mode').onchange=ev=>{mode=ev.target.value;jobId=null;tab='jobs';render()};$('#identity').onchange=ev=>{employeeId=ev.target.value;jobId=null;render()};$('#cancel').onclick=$('#cancel-bottom').onclick=()=>{if(!busy)$('#modal').close()};$('#modal').addEventListener('cancel',ev=>{if(busy)ev.preventDefault()});
document.addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b)return;if(b.dataset.nav){tab=b.dataset.nav;jobId=null;render();return}if(b.dataset.open){jobId=b.dataset.open;render();window.scrollTo(0,0);return}if(b.dataset.editEmployee&&mode==='Boss'){employeeForm(b.dataset.editEmployee);return}const j=current();if(b.dataset.editTask&&j){taskForm(j,b.dataset.editTask);return}switch(b.dataset.action){case'back':jobId=null;render();break;case'new-employee':if(mode==='Boss')employeeForm();break;case'new-job':if(mode==='Boss')jobForm();break;case'edit-job':if(mode==='Boss'&&j)jobForm(j);break;case'before-photo':if(j)photoForm(j);break;case'finding':if(j)findingForm(j);break;case'add-task':if(j)taskForm(j);break;case'closeout':if(j)closeoutForm(j);break;case'export':exportData();break;case'import':importData();break}});
document.addEventListener('change',ev=>{const el=ev.target,j=current();if(el.dataset.task&&j){commit(()=>j.tasks.find(t=>t.id===el.dataset.task).done=el.checked);render()}if(el.dataset.expect!==undefined&&j&&mode==='Boss'){commit(()=>j.expectations[Number(el.dataset.expect)]=el.checked);render()}if(el.dataset.findingStatus&&j&&mode==='Boss'){commit(()=>j.findings.find(f=>f.id===el.dataset.findingStatus).status=el.value);render()}if(el.id==='photo-files'){const files=[...el.files];$('#photo-preview').innerHTML='';if(files.length>6){el.value='';$('#form-error').textContent='Choose at most six photos.';return}for(const file of files){if(!['image/jpeg','image/png','image/webp'].includes(file.type))continue;const img=document.createElement('img'),url=URL.createObjectURL(file);img.src=url;img.alt='Selected photo preview';img.onload=img.onerror=()=>URL.revokeObjectURL(url);$('#photo-preview').append(img)}}});
if(!data.employees.some(p=>p.id===employeeId))employeeId=data.employees[0]?.id||'';render();
</script></body></html>
